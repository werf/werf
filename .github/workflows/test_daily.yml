name: test:daily

on:
  schedule:
    - cron: "0 8 * * *"
  repository_dispatch:
    types: ["test:daily"]
  workflow_dispatch:

jobs:
  gate:
    if: github.repository == 'werf/werf'
    runs-on: ubuntu-22.04
    steps:
      - run: true

  lint:
    needs: gate
    uses: ./.github/workflows/_lint.yml

  unit:
    needs: gate
    uses: ./.github/workflows/_test_unit.yml
    with:
      coverage: true

  e2e_simple:
    needs: gate
    uses: ./.github/workflows/_test_e2e_regular.yml
    with:
      scope: simple
      labelFilter: "simple && !needs-kube"
      raceDetectorEnabled: true
      coverage: true
    secrets: inherit

  e2e_complex:
    needs: gate
    uses: ./.github/workflows/_test_e2e_regular.yml
    with:
      scope: complex
      labelFilter: "complex && !needs-kube"
      timeout: 120
      raceDetectorEnabled: true
      coverage: true
    secrets: inherit

  e2e_extra:
    needs: gate
    uses: ./.github/workflows/_test_e2e_regular.yml
    with:
      scope: extra
      labelFilter: "!complex && !simple && !needs-kube"
      raceDetectorEnabled: true
      coverage: true
    secrets: inherit

  e2e_per-k8s:
    needs: gate
    uses: ./.github/workflows/_test_e2e_per-k8s-version.yml
    with:
      labelFilter: needs-kube
      raceDetectorEnabled: true
      coverage: true
    secrets: inherit

  integration_main:
    needs: gate
    uses: ./.github/workflows/_test_integration_regular.yml
    with:
      packages: test/legacy_e2e/suites
      excludePackages: test/legacy_e2e/suites/cleanup_after_converge,test/legacy_e2e/suites/build/stapel_image/git,test/legacy_e2e/suites/docs
      fetchDepth: 0 # Git history as fixtures for tests.
      raceDetectorEnabled: true
      coverage: true
    secrets: inherit

  integration_git:
    needs: gate
    uses: ./.github/workflows/_test_integration_regular.yml
    with:
      packages: test/legacy_e2e/suites/build/stapel_image/git
      raceDetectorEnabled: true
      coverage: true
    secrets: inherit

  integration_per-k8s:
    needs: gate
    uses: ./.github/workflows/_test_integration_per-k8s-version.yml
    with:
      raceDetectorEnabled: true
      coverage: true
    secrets: inherit

  integration_per-cr:
    needs: gate
    uses: ./.github/workflows/_test_integration_per-container-registry.yml
    secrets: inherit

  coverage_report:
    uses: ./.github/workflows/_coverage_report.yml
    needs:
      - unit
      - integration_main
      - integration_git
      - integration_per-k8s
      - integration_per-cr
      - e2e_simple
      - e2e_complex
      - e2e_extra
      - e2e_per-k8s
    secrets: inherit

  notify:
    if: ${{ !cancelled() && needs.gate.result == 'success' }}
    needs:
      - gate
      - lint
      - coverage_report
    uses: werf/common-ci/.github/workflows/notification.yml@main
    secrets:
      loopNotificationGroup: ${{ secrets.LOOP_NOTIFICATION_GROUP }}
      webhook: ${{ secrets.LOOP_NOTIFICATION_WEBHOOK }}
      notificationChannel: ${{ secrets.LOOP_NOTIFICATION_CHANNEL }}
